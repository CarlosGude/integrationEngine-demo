services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Tour\Infrastructure\YamlTourRegistry:
        arguments:
            $configPath: '%kernel.project_dir%/config/tour.yaml'

    app.middleware.rate_limit:
        class: App\Shared\Infrastructure\Middleware\RateLimitMiddleware
        tags:
            - integration_engine.middleware

    app.client.stripe:
        class: App\Billing\Infrastructure\Http\StripeFormClientAdapter
        arguments:
            $httpClient: '@http_client'
            $baseUrl: 'https://api.stripe.com'
            $defaultHeaders:
                Authorization: 'Bearer %env(STRIPE_SECRET_KEY)%'

    # integration-engine v5.2.0 autodiscovers these bundle classes and they
    # can't be autowired in an app (a Shopify secret string; DLQ and mapper
    # resolver ports with no implementation), which breaks the container.
    # Remove once the bundle stops registering them.
    IntegrationEngine\Infrastructure\Webhook\Controller\ShopifyWebhookController:
        autoconfigure: false
    IntegrationEngine\Infrastructure\Webhook\Handler\ProcessWebhookHandler:
        autoconfigure: false
