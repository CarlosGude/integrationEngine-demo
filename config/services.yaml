services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Tour\Infrastructure\YamlTourRegistry:
        arguments:
            $configPath: '%kernel.project_dir%/config/tour.yaml'

    app.middleware.rate_limit:
        class: App\Shared\Infrastructure\Middleware\RateLimitMiddleware
        tags:
            - integration_engine.middleware

    app.client.supplier_csv:
        class: App\Pricing\Infrastructure\Http\SupplierCsvClient
        arguments:
            $httpClient: '@http_client'
            $baseUrl: '%env(SUPPLIER_BASE_URL)%'

    app.client.stripe:
        class: IntegrationEngine\Infrastructure\Adapter\FormEncodedClientAdapter
        arguments:
            $httpClient: '@http_client'
            $baseUrl: 'https://api.stripe.com'
            $defaultHeaders:
                Authorization: 'Bearer %env(STRIPE_SECRET_KEY)%'

    IntegrationEngine\Infrastructure\Webhook\WebhookEventDispatcher:
        arguments:
            - '@event_dispatcher'

# No monolog-bundle is installed, so FrameworkBundle's LoggerPass falls back to
# Symfony\Component\HttpKernel\Log\Logger writing straight to STDERR. That's
# harmless for plain PHPUnit runs but Infection aborts its initial test suite
# the instant anything appears on STDERR — and expected error-path tests
# (404s, invalid webhook signatures, ...) log through the kernel's
# ErrorListener, which trips it immediately. Route it to stdout instead.
when@test:
    services:
        logger:
            class: Symfony\Component\HttpKernel\Log\Logger
            arguments:
                $output: 'php://stdout'
