security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        users_in_memory:
            memory:
                users:
                    # The username has to be a literal: Symfony does not resolve
                    # env placeholders in configuration keys. Only the hash is
                    # configurable, via ADMIN_PASSWORD_HASH.
                    admin:
                        password: '%env(ADMIN_PASSWORD_HASH)%'
                        roles: ['ROLE_ADMIN']

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: users_in_memory
            # http_basic keeps the demo free of login forms and user entities.
            # The storefront and the tour stay anonymous — only the paths in
            # access_control below actually demand a role.
            http_basic: ~

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        # Inbound webhooks authenticate themselves by signature (the Webhook
        # component verifies the HMAC), so they must stay reachable anonymously.
        - { path: ^/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        # These three POST endpoints publish to any Mercure topic. Anonymous
        # access let anyone push forged payments into the admin dashboard.
        - { path: ^/api/mercure, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
