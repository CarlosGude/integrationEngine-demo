framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    php_errors:
        log: true
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
    webhook:
        routing:
            stripe:
                service: App\Integrations\Stripe\Webhook\StripePaymentIntentParser
                secret: '%env(STRIPE_WEBHOOK_SECRET)%'
