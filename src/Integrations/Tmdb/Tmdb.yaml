get_configuration:
  action: 'App\Integrations\Tmdb\GetConfiguration\GetConfigurationAction'
  method: GET
  path: /3/configuration
  mapper: 'App\Integrations\Tmdb\Mappers\GetConfigurationMapper'

get_movie:
  action: 'App\Integrations\Tmdb\GetMovie\GetMovieAction'
  method: GET
  path: /3/movie/{movie_id}
  mapper: 'App\Integrations\Tmdb\Mappers\GetMovieMapper'

get_tv_season:
  action: 'App\Integrations\Tmdb\GetTvSeason\GetTvSeasonAction'
  method: GET
  path: /3/tv/{tv_id}/season/{season_number}
  mapper: 'App\Integrations\Tmdb\Mappers\GetTvSeasonMapper'
