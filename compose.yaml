services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: integrationengine-demo-app
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      # APP_SECRET is deliberately absent. A real environment variable beats
      # every .env file in Symfony, so setting it here gave the container a
      # different secret from the one `symfony server:start` picks up out of
      # .env.dev — same app, two secrets, sessions invalidated by whichever way
      # you happened to start it. The .env chain is the single source now.
      DEFAULT_URI: http://localhost:8080/
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./:/app:rw
      - /app/var
      - /app/vendor
    working_dir: /app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  supplier:
    build:
      context: ./docker/supplier
    restart: unless-stopped

###> symfony/mercure-bundle ###
  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      # HTTPS is off: the hub is only reached over the internal compose network,
      # and Caddy's automatic TLS would otherwise serve a cert the healthcheck
      # cannot verify.
      SERVER_NAME: ':80'
      # No literal fallback: Compose interpolates MERCURE_JWT_SECRET from .env,
      # and `:?` makes it fail loudly rather than quietly booting a hub with a
      # publicly known key.
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?set MERCURE_JWT_SECRET in .env or .env.local}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?set MERCURE_JWT_SECRET in .env or .env.local}
      # Set the URL of your Symfony project (without trailing slash!) as value of the cors_origins directive
      # 8080 is the port the php service publishes above; 8000 covers `symfony serve`.
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:8080 http://127.0.0.1:8000
    # No `command:` override on purpose. The Flex recipe pins
    # `caddy run --config /etc/caddy/dev.Caddyfile`, but dunglas/mercure has
    # shipped only /etc/caddy/Caddyfile since v2.x, so that override made the
    # container crash-loop. The image's own default command is correct — if
    # `composer recipes:update` puts the override back, delete it again.
    healthcheck:
      # Not /healthz: the recipe's endpoint does not exist in this image. Its
      # Caddyfile serves a welcome page on / and answers 404 everywhere else,
      # so / is the only thing that proves the hub is actually up.
      test: ["CMD", "curl", "-f", "http://localhost/"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - mercure_data:/data
      - mercure_config:/config
###< symfony/mercure-bundle ###

volumes:
###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
###< symfony/mercure-bundle ###
