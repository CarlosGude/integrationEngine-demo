services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: integrationengine-demo-app
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_SECRET: ${APP_SECRET:-dev-secret}
      DATABASE_URL: sqlite:///%kernel.project_dir%/var/data.db
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./:/app:rw
      - /app/var
      - /app/vendor
    working_dir: /app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes: {}
