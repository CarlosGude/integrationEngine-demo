worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    proxy_buffering off;
    fastcgi_buffering off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;

        server_name _;
        root /app/public;

        location / {
            # No `$uri/` here, on purpose. It matches the document root itself
            # for `GET /`, so nginx tries to serve a directory index and
            # answers 403 instead of ever reaching the front controller. This
            # is the shape Symfony documents.
            try_files $uri /index.php$is_args$args;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_buffering off;
            fastcgi_request_buffering off;
            include fastcgi_params;
            # The app is exposed directly on the same port as this listener.
            # Preserve it in absolute URLs generated by Symfony's profiler.
            fastcgi_param HTTP_HOST $host:$server_port;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
