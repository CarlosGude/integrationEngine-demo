user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    proxy_buffering off;
    fastcgi_buffering off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name _;
        root /app/public;

        location / {
            # No `$uri/` here, on purpose. It matches the document root itself
            # for `GET /`, so nginx tries to serve a directory index and
            # answers 403 instead of ever reaching the front controller. This
            # is the shape Symfony documents.
            try_files $uri /index.php$is_args$args;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_buffering off;
            fastcgi_request_buffering off;
            include fastcgi_params;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
