deptrac:
  paths:
    - ./src

  exclude_files: []

  layers:
    - name: Shared
      collectors:
          - type: className
            regex: ^App\\Shared\\.*

    - name: Integrations
      collectors:
          - type: className
            regex: ^App\\Integrations\\.*

    - name: Catalog
      collectors:
          - type: className
            regex: ^App\\Catalog\\.*

    - name: Billing
      collectors:
          - type: className
            regex: ^App\\Billing\\.*

    - name: Pricing
      collectors:
          - type: className
            regex: ^App\\Pricing\\.*

    - name: Legacy
      collectors:
          - type: className
            regex: ^App\\Legacy\\.*

    - name: Tour
      collectors:
          - type: className
            regex: ^App\\Tour\\.*

    - name: UI
      collectors:
          - type: className
            regex: ^App\\(Controller|Command|Console)\\.*

    - name: Kernel
      collectors:
          - type: className
            regex: ^App\\Kernel$

  ruleset:
    UI:
      - Shared
      - Catalog
      - Billing
      - Pricing
      - Tour
    Kernel: []
    Shared: []
    Integrations:
      - Shared
    Catalog:
      - Shared
      - Integrations
    Billing:
      - Shared
      - Integrations
    Pricing:
      - Shared
    Legacy:
      - Shared
    Tour:
      - Shared
      - Catalog
      - Billing
