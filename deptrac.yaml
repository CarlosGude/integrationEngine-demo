deptrac:
  paths:
    - ./src

  exclude_files: []

  layers:
    - name: Shared
      collectors:
          - type: classNameRegex
            value: '#^App\\Shared\\.*#'

    - name: Integrations
      collectors:
          - type: classNameRegex
            value: '#^App\\Integrations\\.*#'

    - name: Catalog
      collectors:
          - type: classNameRegex
            value: '#^App\\Catalog\\.*#'

    - name: Billing
      collectors:
          - type: classNameRegex
            value: '#^App\\Billing\\.*#'

    - name: Pricing
      collectors:
          - type: classNameRegex
            value: '#^App\\Pricing\\.*#'

    - name: Legacy
      collectors:
          - type: classNameRegex
            value: '#^App\\Legacy\\.*#'

    - name: Tour
      collectors:
          - type: classNameRegex
            value: '#^App\\Tour\\.*#'

    - name: UI
      collectors:
          - type: classNameRegex
            value: '#^App\\(Controller|Command|Console)\\.*#'

    - name: Kernel
      collectors:
          - type: classNameRegex
            value: '#^App\\Kernel$#'

  ruleset:
    UI:
      - Shared
      - Catalog
      - Billing
      - Pricing
      - Tour
    Kernel: []
    Shared: []
    Integrations:
      - Shared
    Catalog:
      - Shared
      - Integrations
    Billing:
      - Shared
      - Integrations
    Pricing:
      - Shared
      - Integrations
    Legacy:
      - Shared
    Tour:
      - Shared
      - Catalog
      - Billing
      - Pricing
