name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Tests (PHPUnit)
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,intl,zip
          coverage: pcov

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist

      - name: Run tests (with coverage)
        env:
          CI: 1
        run: make test

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  code-style:
    runs-on: ubuntu-latest
    name: Code Style (PHP CS Fixer)
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist

      - name: Check code style
        run: make cs

  static-analysis:
    runs-on: ubuntu-latest
    name: Static Analysis (PHPStan)
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,intl,zip

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist

      - name: Run PHPStan
        run: make stan

  architecture:
    runs-on: ubuntu-latest
    name: Architecture (Deptrac)
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist

      - name: Check architecture
        run: make deptrac

  production-install:
    runs-on: ubuntu-latest
    name: Production Install (--no-dev)
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl, zip
          coverage: none

      # T-02: EasyAdmin sat in require-dev while config/bundles.php loaded it
      # in every environment, so a production install did not boot. Nothing
      # caught it because no job had ever run composer without dev packages.
      - name: Install without dev dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Warm up the production cache
        env:
          APP_ENV: prod
          APP_DEBUG: 0
          APP_SECRET: ci-only-not-a-secret
          DATABASE_URL: 'sqlite:///:memory:'
          ADMIN_PASSWORD_HASH: '$2y$13$MaohGFFbP19Yy1EuT03go.ecWPw/NbAvyfVljFuvPfxrKHwkj86PS'
        run: php bin/console cache:warmup

  compose-config:
    runs-on: ubuntu-latest
    name: Compose Config Valid
    steps:
      - uses: actions/checkout@v4

      # T-01: compose.yaml was invalid YAML for a while and nothing caught it,
      # because build-image below goes straight to the Dockerfile and never
      # parses Compose. This job is the guard.
      - name: Validate compose.yaml
        run: docker compose config -q

      - name: Both services are declared
        run: |
          services=$(docker compose config --services | sort | tr '\n' ' ')
          echo "services: $services"
          [ "$services" = "mercure php supplier " ] || {
            echo "::error::expected 'mercure php supplier', got '$services'"
            exit 1
          }

  build-image:
    runs-on: ubuntu-latest
    name: Build Docker Image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mutation-testing:
    runs-on: ubuntu-latest
    name: Mutation Testing (Infection)
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,intl,zip
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist

      - name: Run mutation testing
        run: make mutation

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: |
            var/infection/infection.log
            var/infection/summary.log
          if-no-files-found: ignore
