tour:
  when-suppliers-fail:
    title: When Suppliers Fail
    description: Resiliency and retries
    content: |
      **The Problem:** External APIs fail. Networks time out. Rate limiters kick in. Servers crash. What do you do when the supplier API returns 503, or the request takes 30 seconds to respond?

      Without a strategy, your app fails too. The user gets an error. Your business loses money. This is where **resilience patterns** shine.

      **Three Strategies:**

      1. **Retry with Exponential Backoff**
         - When a request fails with a transient error (429 rate limit, 503 service unavailable, timeout), automatically retry
         - But wait between attempts: 100ms, 200ms, 400ms — exponential backoff
         - Don't retry permanent errors: 400 (bad request), 401 (auth failed), 404 (not found)
         - Give up after 3 attempts; throw an error to the caller

      2. **Circuit Breaker Pattern**
         - If the supplier API fails 5 times in 10 seconds, **stop trying immediately**
         - Don't hammer the failing API — let it recover
         - Go into "OPEN" state: reject requests without calling upstream
         - After 30 seconds, enter "HALF_OPEN": try 1 request to test recovery
         - If it succeeds, go back to "CLOSED" (normal operation)
         - If it fails again, back to "OPEN"

      3. **Fallback Strategies**
         - When retries are exhausted and the circuit is open, you have options:
           - **Null fallback**: Return null (show "data unavailable" to user)
           - **Cache fallback**: Return last known good value (show slightly stale data)
           - **Default fallback**: Return a safe default (e.g., 0 inventory instead of error)

      **Why This Matters:**
      A single supplier timing out should NOT crash your entire store. Resilience patterns let you:
      - Keep serving users (with degraded functionality)
      - Protect failing services from cascading failures
      - Recover automatically when upstream is healthy again

      **How IntegrationEngine Fits:**
      The engine provides the foundation; you decide the policy. In v7.0, `ResiliencePolicyInterface` will let you declare retry/fallback behavior in your action config:

      ```yaml
      supplier:
          integrations:
              supplier:
                  retry_policy: exponential_backoff
                  circuit_breaker: true
                  fallback: last_cached_value
      ```

      Until then, implement these patterns as custom middleware in your project — exactly what you see here.

  renting-a-movie:
    title: Renting a Movie
    description: Outbound integrations with Stripe
    content: |
      **The Problem:** Movies are free to browse, but renting requires payment. How do we integrate a payment processor securely and cleanly?

      Without structure, you'd mix HTTP, JSON parsing, auth tokens, and error handling into one messy service. With IntegrationEngine, Stripe is just another protocol — exactly like TMDB, CSV, or GraphQL.

      **The Solution:** `RentalPaymentGateway` follows the same pattern as `MovieCatalogGateway`:
      1. Dispatch via the engine's `send()` call
      2. Get a typed `CreatePaymentIntentResponse` DTO back
      3. Translate to domain: `RentalPayment::fromInfrastructure()`

      One line change to the YAML config, one new action/mapper/response — and you're processing payments cleanly.

      **Why Stripe Works Here:**
      - Stripe API is HTTP + JSON like TMDB
      - We built a `StripeFormClientAdapter` for form-encoded payloads (Stripe's requirement)
      - Auth is Bearer token (same mechanism as TMDB)
      - The integration stays outside domain logic — reusable, testable, mockable

      **Next:** Webhooks confirm the payment status when the customer completes checkout.

  payment-confirmation:
    title: Payment Confirmation
    description: Webhooks and async processing
    content: |
      **The Problem:** When a customer authorizes a payment on Stripe, we need to know about it — but we can't wait forever for their response. Stripe sends us webhook events instead.

      Webhooks are **inbound**: Stripe calls *us* (not the other way around). Every webhook must validate its signature before we trust the data inside.

      **The Solution:** Symfony's `symfony/webhook` + `symfony/remote-event` handles the transport; IntegrationEngine supplies the pieces around it:
      1. **StripePaymentIntentParser** extends the engine's `IntegrationWebhookRequestParser` and validates Stripe's timestamped HMAC signature with `TimestampedHmacSignatureVerifier` (proves Stripe sent it, rejects replays older than 5 minutes)
      2. **StripePaymentIntentMapper** (`AbstractWebhookMapper`) turns the raw payload into a typed `StripePaymentIntentEvent`
      3. **StripePaymentIntentConsumer** hands the event to the engine's `WebhookEventDispatcher`, which dispatches the typed event to Billing's listener

      All via a declarative attribute: `#[AsRemoteEventConsumer('stripe')]`.

      **How the Flow Works:**
      ```
      POST /webhook/stripe (Stripe sends a signed event)
        → StripePaymentIntentParser verifies Stripe-Signature (t=…,v1=…)
        → RemoteEvent dispatched to Messenger (async or sync)
        → StripePaymentIntentConsumer maps it to StripePaymentIntentEvent
        → StripePaymentIntentEventListener (Billing) handles it
        → Your app responds 202 Accepted (webhook delivered)
      ```

      **Security:** Without signature validation, any attacker could fake payment events. The signature proves the webhook came from Stripe's servers.

  the-problem:
    title: The Problem
    description: Why integrations are hard
    content: |
      Most API integrations follow the same pattern: one huge service handling everything.

      **Antipattern #1: God Class** — HTTP, JSON parsing, mapping, caching, error handling — all in one class.

      **Antipattern #2: Tight Coupling** — Change the API URL, response format, or headers? Refactor the whole class.

      **Antipattern #3: No Reusability** — Want to fetch the same movie in a different context? Copy-paste the method.

      **Antipattern #4: Manual Caching** — Cache tokens, configs, or API responses? Write a cache layer for each service.

      **Antipattern #5: Error Handling Buried** — Where do you catch 401s, retries, timeouts? Scattered through the logic.

      **IntegrationEngine solves this by:**
      - Separating concerns: one action per endpoint, one mapper per response type.
      - Decoupling from API details: reconfigure in YAML, not code.
      - Built-in middleware: caching, retries, tracing — out of the box.
      - Standardized errors: same handling for all integrations.

  parallel-requests:
    title: Parallel Requests
    description: How the engine handles concurrency
    content: |
      **The Problem:** Loading 20 movies means 20 HTTP requests. Even at 200ms each, that's 4 seconds sequentially.

      **The Solution:** IntegrationEngine's `sendMany()` runs all requests **in parallel** via `BatchClientInterface`.

      One call to `getMoviesByIdBatch([id1, id2, ..., id20])` dispatches all 20 requests concurrently, then collects results.

      **Benchmark Results** (real data from your runs):
      - 5 movies in parallel: ~200-250ms (vs. ~1000ms sequential)
      - 20 movies in parallel: ~300-400ms (vs. ~4000ms sequential)

      **Graceful Failures:** If movie #7 fails, movies #1-6 and #8-20 still load. Error cards show where data is missing.

  behind-the-counter:
    title: Behind the Counter
    description: Extensibility without code changes
    content: |
      **The Problem:** Every API has limits. TMDB: 40 requests/10 seconds. Stripe: 100 requests/second. Shopify: 2 requests/second.

      Without structure, you're adding retry logic, backoff, and rate limiting inside every integration — manually, inconsistently.

      **The Solution:** IntegrationEngine's **middleware pipeline** lets you add cross-cutting concerns *once* and apply them everywhere.

      **How It Works:**

      1. **Define a Middleware** — implement `AbstractClientMiddleware` with `process()` and `processMany()`.
      2. **Register it as a Service** — tag it with `integration_engine.middleware`.
      3. **Wire it in YAML** — declare it under `middlewares:` per integration. No code changes needed.

      In 30 lines, `RateLimitMiddleware` handles both single requests and batches, checking Symfony's rate limiter before each call.

      **Extensibility Examples:**
      - Rate limiting (shown here)
      - Response caching
      - Request signing (OAuth 1.0a)
      - Custom retries
      - Audit logging

      Add a new feature *without touching* action, mapper, or controller code.
