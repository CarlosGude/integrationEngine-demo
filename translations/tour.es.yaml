tour:
  renting-a-movie:
    title: Alquilando una película
    description: Integraciones salientes con Stripe
    content: |
      **El Problema:** Las películas son gratis para explorar, pero alquilar requiere pago. ¿Cómo integramos un procesador de pagos de forma segura y limpia?

      Sin estructura, mezclarías HTTP, parsing JSON, tokens de auth y manejo de errores en un servicio desordenado. Con IntegrationEngine, Stripe es solo otro protocolo — exactamente como TMDB, CSV o GraphQL.

      **La Solución:** `RentalPaymentGateway` sigue el mismo patrón que `MovieCatalogGateway`:
      1. Dispara vía la llamada `send()` del engine
      2. Obtén un DTO tipado `CreatePaymentIntentResponse`
      3. Traduce al dominio: `RentalPayment::fromInfrastructure()`

      Un cambio en el YAML, una nueva acción/mapper/response — e integras pagos de forma limpia.

      **Por qué Stripe funciona aquí:**
      - La API de Stripe es HTTP + JSON como TMDB
      - Construimos un `StripeFormClientAdapter` para payloads form-encoded (requisito de Stripe)
      - Auth es Bearer token (mismo mecanismo que TMDB)
      - La integración está fuera de la lógica de dominio — reutilizable, testeable, mockeable

      **Siguiente:** Los webhooks confirman el estado del pago cuando el cliente completa el checkout.

  payment-confirmation:
    title: Confirmación del Pago
    description: Webhooks y procesamiento asincrónico
    content: |
      **El Problema:** Cuando un cliente autoriza un pago en Stripe, necesitamos saberlo — pero no podemos esperar para siempre su respuesta. En su lugar, Stripe nos envía eventos webhook.

      Los webhooks son **entrantes**: Stripe nos llama *a nosotros* (no al revés). Cada webhook debe validar su firma antes de confiar en los datos dentro.

      **La Solución:** `symfony/webhook` + `symfony/remote-event` de Symfony se encargan del transporte; IntegrationEngine aporta las piezas de alrededor:
      1. **StripePaymentIntentParser** extiende el `IntegrationWebhookRequestParser` del engine y valida la firma HMAC con timestamp de Stripe mediante `TimestampedHmacSignatureVerifier` (prueba que Stripe la envió y rechaza reenvíos de más de 5 minutos)
      2. **StripePaymentIntentMapper** (`AbstractWebhookMapper`) convierte el payload en un `StripePaymentIntentEvent` tipado
      3. **StripePaymentIntentConsumer** pasa el evento al `WebhookEventDispatcher` del engine, que despacha el evento tipado al listener de Billing

      Todo vía un atributo declarativo: `#[AsRemoteEventConsumer('stripe')]`.

      **Cómo fluye:**
      ```
      POST /webhook/stripe (Stripe envía un evento firmado)
        → StripePaymentIntentParser verifica Stripe-Signature (t=…,v1=…)
        → RemoteEvent despachado a Messenger (async o sync)
        → StripePaymentIntentConsumer lo mapea a StripePaymentIntentEvent
        → StripePaymentIntentEventListener (Billing) lo procesa
        → Tu app responde 202 Aceptado (webhook entregado)
      ```

      **Seguridad:** Sin validación de firma, cualquier atacante podría falsificar eventos de pago. La firma prueba que el webhook vino de los servidores de Stripe.

  the-problem:
    title: El Problema
    description: Por qué las integraciones son difíciles
    content: |
      La mayoría de integraciones de APIs siguen el mismo patrón: un enorme servicio manejando todo.

      **Antipatrón #1: Clase Dios** — HTTP, parseo de JSON, mapeo, caché, manejo de errores — todo en una clase.

      **Antipatrón #2: Acoplamiento Fuerte** — ¿Cambiar la URL de la API, formato de respuesta o headers? Refactoriza toda la clase.

      **Antipatrón #3: Sin Reusabilidad** — ¿Quieres obtener la misma película en otro contexto? Copia-pega el método.

      **Antipatrón #4: Caché Manual** — ¿Cachear tokens, configuraciones o respuestas de API? Escribe una capa de caché para cada servicio.

      **Antipatrón #5: Manejo de Errores Disperso** — ¿Dónde capturas 401s, reintentos, timeouts? Esparcido por toda la lógica.

      **IntegrationEngine resuelve esto:**
      - Separando responsabilidades: una acción por endpoint, un mapper por tipo de respuesta.
      - Desacoplando de detalles de API: reconfigura en YAML, no en código.
      - Middleware integrado: caché, reintentos, trazabilidad — lista para usar.
      - Errores estandarizados: mismo manejo para todas las integraciones.

  parallel-requests:
    title: Solicitudes Paralelas
    description: Cómo el motor maneja concurrencia
    content: |
      **El Problema:** Cargar 20 películas significa 20 peticiones HTTP. Incluso a 200ms cada una, son 4 segundos en secuencia.

      **La Solución:** El `sendMany()` de IntegrationEngine ejecuta todas las peticiones **en paralelo** vía `BatchClientInterface`.

      Una sola llamada a `getMoviesByIdBatch([id1, id2, ..., id20])` despacha los 20 en concurrencia, luego recolecta resultados.

      **Resultados del Benchmark** (datos reales de tus ejecuciones):
      - 5 películas en paralelo: ~200-250ms (vs. ~1000ms secuencial)
      - 20 películas en paralelo: ~300-400ms (vs. ~4000ms secuencial)

      **Fallos Elegantes:** Si la película #7 falla, las #1-6 y #8-20 se siguen cargando. Tarjetas de error muestran qué falta.

  behind-the-counter:
    title: Detrás del Mostrador
    description: Extensibilidad sin cambios de código
    content: |
      **El Problema:** Toda API tiene límites. TMDB: 40 requests/10 segundos. Stripe: 100 requests/segundo. Shopify: 2 requests/segundo.

      Sin estructura, añades lógica de reintentos, backoff y rate limiting dentro de cada integración — manualmente, inconsistentemente.

      **La Solución:** El **pipeline de middleware** de IntegrationEngine te permite agregar preocupaciones transversales *una sola vez* y aplicarlas en todas partes.

      **Cómo Funciona:**

      1. **Define un Middleware** — implementa `AbstractClientMiddleware` con `process()` y `processMany()`.
      2. **Regístralo como Servicio** — etiquétalo con `integration_engine.middleware`.
      3. **Conéctalo en YAML** — decláralo bajo `middlewares:` por integración. Sin cambios de código.

      En 30 líneas, `RateLimitMiddleware` maneja requests individuales y batches, verificando el rate limiter de Symfony antes de cada llamada.

      **Ejemplos de Extensibilidad:**
      - Limitación de rate (mostrado aquí)
      - Caché de respuestas
      - Firma de requests (OAuth 1.0a)
      - Reintentos personalizados
      - Auditoría

      Agrega nuevas características *sin tocar* acciones, mappers ni código de controllers.
